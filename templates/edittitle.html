<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Edit Title</title>
</head>
<body>
    <h1 class="title mt-4 has-text-centered">Edit: {{ book.title }}</h1>
    
    <form method="POST">
        <label>Status:</label>
        <select name="status" required>
            <option value="to_be_read" {% if book.status == 'to_be_read' %}selected{% endif %}>Want to Read</option>
            <option value="currently_reading" {% if book.status == 'currently_reading' %}selected{% endif %}>Currently Reading</option>
            <option value="read" {% if book.status == 'read' %}selected{% endif %}>Finished</option>
        </select>
        
        <button type="submit">Update</button>
        <a href="/view"><button type="button">Cancel</button></a>
    </form>
    <a href="{{url_for('tracker')}}" id="homebutton"><button class="button is-primary">Home</button></a>
</body>
</html>
