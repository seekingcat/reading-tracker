<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Add title</title>
</head>
<body>
    <div class="container">
        <h1 class="title has-text-centered">Add a Title</h1>
        <form class="box" action="/add" method="post">
            <div class="field">
                <label class="label">Title</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Lord of the Rings" name="title"/>
                </div>
            </div>

            <div class="field">
                <label class="label">Author</label>
                <div class="control">
                    <input class="input" type="text" placeholder="J. R. R. Tolkein" name="author"/>
                </div>
            </div>
            
            <div class="field">
                <label class="label">Status</label>
                <div class="control">
                    <div class="select is-link">
                        <select name="status">
                            <option>Select dropdown</option>
                            <option value = 'to_be_read'>To be read</option>
                            <option value = 'currently_reading'>Currently reading</option>
                            <option value = 'read'>Read</option>
                        </select>
                    </div>
                </div>
            </div>

            <button class="button is-primary">Add</button>
        </form>

        <a href="{{url_for('tracker')}}">
            <button class="button is-primary">Home</button>
        </a>
    </div>
</body>
</html>
